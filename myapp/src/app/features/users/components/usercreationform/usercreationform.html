
<h3 class="text-center m-5">Create user</h3>

<p-dialog 
    header="Create User"
    [modal]="true"
    [style]="{ width: '25rem' }"
    [(visible)]="visible"
>

    <div class="flex items-center gap-4 mb-8">
        <label for="username" class="font-semibold w-24">Username</label>
        <input type="text" pInputText  id="username" autocomplete="off" class="flex-auto">
    </div>

    <div class="flex items-center gap-4 mb-8">
        <label for="name" class="font-semibold w-24">Name</label>
        <input type="text" pInputText  id="name" class="flex-auto" autocomplete="off" />
    </div>

    <div class="flex items-center gap-4 mb-8">
        <label for="email" class="font-semibold w-24">Email</label>
        <input type="text" pInputText  id="email" class="flex-auto" autocomplete="off" />
    </div>


    <div class="flex justify-end gap-2">
        <p-button label="Save" severity="secondary" (onClick)="onButtonClick()" />
        <p-button label="Cancel" severity="secondary" (onClick)="onButtonClick()" />
    </div>

</p-dialog>
